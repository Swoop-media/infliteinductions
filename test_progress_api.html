
<!DOCTYPE html>
<html>
<head>
    <title>Test Progress API</title>
</head>
<body>
    <h1>Test Assignment Progress API</h1>
    <button onclick="testAPI()">Test Progress API</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const result = document.getElementById('result');
            result.innerHTML = 'Testing...';
            
            try {
                const response = await fetch('/api/assignment/progress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        assignmentId: '291be35f-80c9-4713-a676-01fb7ecad8df',
                        moduleId: 'test-module-id'
                    })
                });
                
                const data = await response.json();
                result.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                result.innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
